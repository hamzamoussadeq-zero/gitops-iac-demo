name: Terraform Security Scan

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  

jobs:
  checkov:
    name: Checkov — Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov==3.2.424

      - name: Run Checkov
        id: scan
        run: |
          set +e
          checkov -d . --framework terraform --output cli --output json --output-file-path console,results.json --quiet
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const exitCode = '${{ steps.scan.outputs.exit_code }}';
            const passed = exitCode === '0';

            let body = '## Terraform Security Scan Results\n\n';

            try {
              const raw = JSON.parse(fs.readFileSync('results.json', 'utf8'));
              const results = Array.isArray(raw) ? raw : [raw];

              body += '### Summary\n\n';
              body += '| Framework | ✅ Passed | ❌ Failed | ⏭ Skipped |\n';
              body += '|-----------|----------|----------|----------|\n';
              for (const r of results) {
                const s = r.summary ?? {};
                body += `| \`${r.check_type}\` | ${s.passed ?? 0} | ${s.failed ?? 0} | ${s.skipped ?? 0} |\n`;
              }

              for (const r of results) {
                const failed = r.results?.failed_checks ?? [];
                if (!failed.length) continue;

                body += `\n---\n\n`;
                body += `<details>\n<summary>❌ <code>${r.check_type}</code> — ${failed.length} Failed Check${failed.length > 1 ? 's' : ''}</summary>\n\n`;
                body += '| Check ID | What it checks | Severity | Resource | File | Line |\n';
                body += '|----------|----------------|----------|----------|------|------|\n';

                for (const c of failed) {
                  const id       = c.check_id ?? '—';
                  const name     = c.check_name ?? '—';
                  const sev      = c.severity ?? 'N/A';
                  const resource = c.resource ?? '—';
                  const file     = (c.repo_file_path ?? c.file_path ?? '—').replace(/^\//, '');
                  const line     = c.file_line_range ? c.file_line_range[0] : '—';
                  body += `| \`${id}\` | ${name} | ${sev} | \`${resource}\` | \`${file}\` | ${line} |\n`;
                }

                body += '\n</details>\n';
              }

              body += `\n---\n\n**Overall: ${passed ? '✅ All checks passed' : '❌ Issues found — merge blocked'}**`;

            } catch (e) {
              body += `> ⚠️ Could not parse scan results: ${e.message}`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if violations found
        if: steps.scan.outputs.exit_code != '0'
        run: exit 1
